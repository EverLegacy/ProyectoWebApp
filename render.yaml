databases:
  - name: loyalty-app-db
    plan: free
    databaseName: loyalty_db
    user: loyalty_user

services:
  - type: web
    name: loyalty-app-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: loyalty-app-db
          property: connectionString
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: loyalty-app-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
